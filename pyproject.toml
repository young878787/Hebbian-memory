[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hela-mem-zh-mvp"
version = "0.1.0"
description = "Chinese Hebbian associative memory MVP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "google-genai>=1.0,<2",
  "openai>=1.60,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
hela-mem = "hela_mem_zh_mvp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hela_mem_zh_mvp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
